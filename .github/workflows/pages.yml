name: Collect and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 06:00 Asia/Tokyo (UTC+9)
  workflow_dispatch:
    inputs:
      refresh:
        description: '公式情報を収集してから公開する'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: kochi-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Keep baseline for loss detection
        run: cp data/catalog.json "$RUNNER_TEMP/catalog-before.json"
      - name: Collect official API and RSS
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python scripts/collect_structured.py --max-details 30
      - name: Collect HTML
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python scripts/crawl.py --max-pages 160 --per-source 40 --time-budget 600 --delay 1.5
      - name: Collect PDF evidence
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python scripts/collect_pdfs.py --max-files 20
      - name: Re-extract records saved by older HTML parsers
        if: github.event_name != 'workflow_dispatch' || inputs.refresh
        run: python scripts/refresh_html.py --all --workers 4
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python scripts/build.py
      - name: Test collection and search
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Validate output and detect data loss
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python scripts/validate_site.py --baseline "$RUNNER_TEMP/catalog-before.json"
      - name: Save collected state
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update official support information'
            git push origin HEAD:main
          fi
      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summarize collection
        if: always()
        run: python scripts/run_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded source revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.build.outputs.revision }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_sha" = "$EXPECTED_SHA"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
